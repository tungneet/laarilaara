# Netlify deployment configuration for the Next.js frontend in this monorepo.
# The Next.js adapter is auto-detected by Netlify; no publish directory or
# functions directory should be configured manually.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_BASE_URL = "https://3uehd85j19.execute-api.us-east-1.amazonaws.com"

# Keep Next.js App Router paths working when loaded directly or refreshed.
[[plugins]]
  package = "@netlify/plugin-nextjs"
